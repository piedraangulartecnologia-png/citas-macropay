<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas - Macropay</title>
    <!-- Tailwind CSS para un diseño moderno, responsivo y con los colores oficiales -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macroBlue: '#003366',    /* Azul oficial institucional */
                        macroYellow: '#FFD700',  /* Amarillo oficial institucional */
                        macroDarkYellow: '#CCA100'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-macroBlue text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-2">
                <!-- Simulación de Logo corporativo -->
                <span class="bg-macroYellow text-macroBlue font-black text-2xl px-3 py-1 rounded-lg uppercase">MacroPay</span>
                <span class="text-xl font-bold">Agenda de Citas</span>
            </div>
            <p class="text-sm text-macroYellow mt-2 sm:mt-0 font-medium" id="fecha-actual"></p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Grid de Secciones -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Formulario de Registro -->
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-macroYellow">
                <h2 class="text-xl font-bold text-macroBlue mb-4 flex items-center gap-2">
                    📅 Agendar Nueva Cita
                </h2>

                <!-- NOTA: Reemplaza 'tu-correo@tu-dominio.com' o usa tu endpoint de Formspree -->
                <form id="citaForm" action="https://formspree.io/f/tu-id-de-formulario" method="POST" class="space-y-4">
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Nombre del Cliente:</label>
                        <input type="text" name="nombre" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-macroBlue outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Teléfono de Contacto:</label>
                        <input type="tel" name="telefono" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-macroBlue outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Tienda / Sucursal:</label>
                        <select name="tienda" id="tiendaSelect" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-macroBlue outline-none bg-white">
                            <option value="">Selecciona una tienda</option>
                            <option value="Trujano">Trujano</option>
                            <option value="Macroplaza">Macroplaza</option>
                            <option value="Mina">Mina</option>
                            <option value="Victoria">Victoria</option>
                            <option value="Aldama">Aldama</option>
                            <option value="Tlacolula">Tlacolula</option>
                            <option value="Tlacolula Portales">Tlacolula Portales</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Asunto:</label>
                        <select name="asunto" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-macroBlue outline-none bg-white">
                            <option value="">Selecciona el trámite</option>
                            <option value="Credito de moto">Crédito de moto</option>
                            <option value="Credito de celular">Crédito de celular</option>
                            <option value="Pago semanal">Pago semanal</option>
                            <option value="Entrega de enganche">Entrega de enganche</option>
                            <option value="Compra de electrodomestico">Compra de electrodoméstico</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Fecha de la Cita:</label>
                        <input type="date" name="fecha" id="fechaCita" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-macroBlue outline-none">
                    </div>

                    <button type="submit" class="w-full bg-macroYellow hover:bg-macroDarkYellow text-macroBlue font-bold py-3 px-4 rounded-lg transition duration-200 shadow">
                        Confirmar y Enviar Cita
                    </button>
                </form>
            </div>

            <!-- Panel de Resultados / Conteo Diario por Tienda -->
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-macroBlue flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-bold text-macroBlue mb-4 flex items-center justify-between">
                        📊 Resultados de Agendados Hoy
                        <button onclick="reiniciarConteoDiario()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded transition">Reiniciar Día</button>
                    </h2>
                    <p class="text-xs text-gray-500 mb-4">Conteo de citas registradas para la jornada actual (se actualiza automáticamente).</p>

                    <div id="conteo-tiendas" class="space-y-3">
                        <!-- Se llena dinámicamente mediante JavaScript -->
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-gray-200 text-center">
                    <p class="text-sm font-semibold text-gray-700">Total general de citas hoy:</p>
                    <span id="total-citas" class="text-3xl font-black text-macroBlue">0</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-macroBlue text-white text-center py-4 mt-8 text-sm">
        <p>Macropay - Sistema de Gestión de Citas &copy; 2026</p>
    </footer>

    <!-- Lógica de JavaScript -->
    <script>
        // Mostrar fecha actual en el header
        const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString('es-ES', opcionesFecha);

        // Establecer la fecha actual por defecto en el input de fecha
        const hoyIso = new Date().toISOString().split('T')[0];
        document.getElementById('fechaCita').value = hoyIso;

        // Listado oficial de sucursales
        const tiendas = ["Trujano", "Macroplaza", "Mina", "Victoria", "Aldama", "Tlacolula", "Tlacolula Portales"];

        // Manejo del almacenamiento local para los conteos diarios
        function obtenerDatosGuardados() {
            let datos = JSON.parse(localStorage.getItem('macropay_citas_dia')) || {};
            const fechaAlmacenada = localStorage.getItem('macropay_fecha_actual');
            
            // Si cambió el día, reiniciamos el contador automáticamente (Actualización diaria)
            if (fechaAlmacenada !== hoyIso) {
                datos = {};
                tiendas.forEach(t => datos[t] = 0);
                localStorage.setItem('macropay_fecha_actual', hoyIso);
                localStorage.setItem('macropay_citas_dia', JSON.stringify(datos));
            }
            return datos;
        }

        function renderizarConteo() {
            const datos = obtenerDatosGuardados();
            const contenedor = document.getElementById('conteo-tiendas');
            contenedor.innerHTML = '';
            let totalGeneral = 0;

            tiendas.forEach(tienda => {
                const cantidad = datos[tienda] || 0;
                totalGeneral += cantidad;

                const fila = document.createElement('div');
                fila.className = "flex justify-between items-center bg-gray-50 px-3 py-2 rounded-lg border";
                fila.innerHTML = `
                    <span class="font-medium text-gray-800">${tienda}</span>
                    <span class="bg-macroBlue text-white text-sm font-bold px-3 py-1 rounded-full">${cantidad}</span>
                `;
                contenedor.appendChild(fila);
            });

            document.getElementById('total-citas').innerText = totalGeneral;
        }

        // Interceptar envío del formulario para sumar al contador local
        document.getElementById('citaForm').addEventListener('submit', function(e) {
            const tiendaSeleccionada = document.getElementById('tiendaSelect').value;
            
            if(tiendaSeleccionada) {
                let datos = obtenerDatosGuardados();
                datos[tiendaSeleccionada] = (datos[tiendaSeleccionada] || 0) + 1;
                localStorage.setItem('macropay_citas_dia', JSON.stringify(datos));
                renderizarConteo();
            }
            // El formulario continúa su envío hacia el correo electrónico de forma normal.
        });

        function reiniciarConteoDiario() {
            if(confirm("¿Estás seguro de reiniciar los contadores de citas a cero?")) {
                let datos = {};
                tiendas.forEach(t => datos[t] = 0);
                localStorage.setItem('macropay_citas_dia', JSON.stringify(datos));
                renderizarConteo();
            }
        }

        // Inicializar vista al cargar la página
        renderizarConteo();
    </script>
</body>
</html>
